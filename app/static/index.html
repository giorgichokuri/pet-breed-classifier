<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pet Breed Classifier</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#1f2328; --muted:#6b7078; --accent:#1aa37a; --line:#e3e1dc; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16181b; --card:#1f2226; --ink:#e8e6e1; --muted:#9aa0a6; --line:#33373c; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:720px; margin:0 auto; padding:32px 16px 64px; }
  h1 { margin:0 0 4px; font-size:28px; }
  p.sub { margin:0 0 24px; color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; }
  label.drop { display:block; border:2px dashed var(--line); border-radius:12px; padding:28px; text-align:center; cursor:pointer; color:var(--muted); }
  label.drop:hover { border-color:var(--accent); }
  input[type=file] { display:none; }
  .row { display:flex; gap:20px; margin-top:20px; flex-wrap:wrap; }
  .row img { width:220px; height:220px; object-fit:cover; border-radius:10px; border:1px solid var(--line); }
  .results { flex:1; min-width:240px; }
  .top { font-size:22px; font-weight:700; }
  .meta { color:var(--muted); font-size:14px; margin-bottom:12px; }
  .bar { margin:6px 0; }
  .bar span { display:flex; justify-content:space-between; font-size:14px; }
  .track { height:8px; background:var(--line); border-radius:4px; overflow:hidden; }
  .fill { height:100%; background:var(--accent); }
  .err { color:#c0392b; }
</style>
</head>
<body>
<main>
  <h1>Pet Breed Classifier</h1>
  <p class="sub">Upload a photo of a cat or dog. The model recognizes 37 breeds (Oxford-IIIT Pet).</p>
  <div class="card">
    <label class="drop" for="file">Click to choose an image</label>
    <input id="file" type="file" accept="image/*">
    <div class="row" id="out" hidden>
      <img id="preview" alt="Uploaded photo">
      <div class="results" id="results">Predicting…</div>
    </div>
  </div>
</main>
<script>
const file = document.getElementById("file"), out = document.getElementById("out"),
      preview = document.getElementById("preview"), results = document.getElementById("results");
file.addEventListener("change", async () => {
  const f = file.files[0];
  if (!f) return;
  preview.src = URL.createObjectURL(f);
  out.hidden = false;
  results.textContent = "Predicting…";
  const body = new FormData();
  body.append("file", f);
  try {
    const r = await fetch("/predict?top_k=5", { method: "POST", body });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || "Request failed");
    results.innerHTML = `<div class="top">${data.breed}</div>
      <div class="meta">${data.species} · ${(data.confidence * 100).toFixed(1)}% · ${data.latency_ms} ms</div>` +
      data.top_k.map(p => `<div class="bar"><span><b>${p.breed}</b><span>${(p.probability * 100).toFixed(1)}%</span></span>
        <div class="track"><div class="fill" style="width:${p.probability * 100}%"></div></div></div>`).join("");
  } catch (e) {
    results.innerHTML = `<span class="err">${e.message}</span>`;
  }
});
</script>
</body>
</html>
